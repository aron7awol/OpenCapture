name: OpenCapture
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.105.0
targets:
  OpenCapture:
    type: application
    platform: iOS
    sources:
      - Sources
      - Core
      - path: Resources
        excludes: [Info.plist]
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aron7awol.OpenCapture
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets: [OpenCaptureUITests]
  OpenCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OpenCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aron7awol.OpenCapture.UITests
        GENERATE_INFOPLIST_FILE: YES
