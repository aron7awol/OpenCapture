<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCapture Controller</title>
<style>
:root{font:15px system-ui,sans-serif;color:#20282b;background:#f5f7f7;color-scheme:light;letter-spacing:0}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #d6dfdf;background:white;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 14px}main{max-width:1350px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(270px,350px) minmax(0,1fr);gap:28px}section{min-width:0}fieldset{border:0;border-bottom:1px solid #d6dfdf;padding:0 0 20px;margin:0 0 20px}legend{font-weight:600;margin-bottom:12px}label{display:block;margin:10px 0}input,select,button{font:inherit;border:1px solid #bac8c9;border-radius:4px;padding:9px;background:white;max-width:100%}input:not([type=checkbox]),select{width:100%;margin-top:5px}input[type=checkbox]{accent-color:#007f75}button{cursor:pointer;min-height:40px}button:disabled{opacity:.5;cursor:default}.primary{background:#007f75;border-color:#007f75;color:white}.danger{color:#a72c35}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#5d6e73;font-size:13px}.status{font-size:13px;overflow-wrap:anywhere}.error{color:#ac2838;white-space:pre-wrap;overflow-wrap:anywhere;min-height:24px}#preview{display:none;width:100%;height:100%;object-fit:contain}.preview{aspect-ratio:4/3;background:#191d1f;display:grid;place-items:center;color:#ccd6d6;overflow:hidden;max-height:65vh}.preview img,.preview span{grid-area:1/1}#cameraInfo{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}th,td{text-align:left;border-bottom:1px solid #d6dfdf;padding:10px 6px;vertical-align:top;overflow-wrap:anywhere}th:nth-child(1){width:30%}.history{margin-top:24px;overflow:auto}details{margin:12px 0}summary{cursor:pointer}a{color:#007f75}code{font-size:12px}footer{padding:12px 24px;border-top:1px solid #d6dfdf;color:#657579;font-size:12px}@media(max-width:750px){main{grid-template-columns:1fr;padding:16px;gap:12px}header{padding:14px 16px}.preview{max-height:none}h1{font-size:20px}}
</style></head><body>
<header><h1>OpenCapture</h1><span id="connection" class="status">Not paired</span></header>
<main><section>
<fieldset><legend>Controller pairing</legend><label>Token<input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button><p id="serverURL" class="muted"></p></fieldset>
<form id="captureForm"><fieldset><legend>Capture</legend>
<label>Mode<select id="mode"><option value="raw">Bayer RAW</option><option value="proraw">Apple ProRAW / highest resolution</option><option value="fast">Fast JPEG burst</option><option value="quality">Quality JPEG</option></select></label>
<div class="row"><label>Frames<input id="frames" type="number" min="1" max="32" value="4" required></label><label>Settle (ms)<input id="settle" type="number" min="0" max="10000" value="500" required></label></div>
<label><input id="manual" type="checkbox"> Manual exposure</label>
<div class="row"><label>Shutter (ms)<input id="exposure" type="number" step="any" min="0.001" max="30000" value="33.333"></label><label>ISO<input id="iso" type="number" step="any" min="1" value="100"></label></div>
<label><input id="manualFocus" type="checkbox"> Manual focus</label><label>Lens position<input id="focus" type="number" min="0" max="1" step="0.001" value="0.5"></label>
<label>Label<input id="label" maxlength="256" placeholder="Optional capture label"></label>
<div class="row"><button id="capture" class="primary" disabled>Capture</button><button id="cancel" class="danger" type="button" disabled>Cancel</button></div>
<div class="row"><button id="apply" type="submit" disabled>Apply controls</button></div>
<p id="readback" class="muted"></p>
</fieldset></form>
<details open><summary>Camera capabilities</summary><p id="cameraInfo" class="muted">No camera connected</p></details>
<p id="error" class="error" role="alert"></p>
</section><section><h2>Live preview <span id="previewAge" class="muted"></span></h2><div class="preview"><span id="previewEmpty">No preview</span><img id="preview" alt="Camera preview"></div>
<div class="history"><h2>Captures</h2><table><thead><tr><th>Request</th><th>Mode</th><th>State</th><th>Files</th></tr></thead><tbody id="jobs"></tbody></table></div>
</section></main><footer>OpenCapture / Protocol 1 / Preview is processed; original files are retained separately.</footer>
<script>
const $=id=>document.getElementById(id); let token='', timer=null, active=null, previewURL=null;
const fragment=new URLSearchParams(location.hash.slice(1)); if(fragment.has('token')){$('token').value=fragment.get('token');history.replaceState(null,'',location.pathname)}
$('serverURL').textContent=location.hostname==='127.0.0.1'||location.hostname==='localhost'?'Phone connection: use this PC\'s LAN address on port '+location.port:location.origin;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...options.headers},cache:'no-store'});if(!r.ok){$('apply').disabled=true;let detail;try{detail=(await r.json()).error}catch{}throw Error(detail||'HTTP '+r.status)}if(path==='/oc/v1/state'){const s=await r.clone().json();const busy=s.jobs.some(j=>!['complete','failed','cancelled','expired'].includes(j.status));$('apply').disabled=busy||s.lastSeenSecondsAgo===null||s.lastSeenSecondsAgo>=15||!s.capabilities?.operations?.includes('applyControls');const c=s.controls;$('readback').textContent=c?`Device: ${(c.deviceExposureSeconds*1000).toFixed(3)} ms / ISO ${c.deviceISO.toFixed(1)} / focus ${c.lensPosition.toFixed(3)}`:''}return r}
function post(path,value={protocolVersion:1}){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)})}
function uuid(){if(crypto.randomUUID)return crypto.randomUUID();return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
async function refresh(){try{const s=await(await api('/oc/v1/state')).json();const live=s.lastSeenSecondsAgo!==null&&s.lastSeenSecondsAgo<15;$('connection').textContent=live?'Camera connected':'Waiting for camera';const c=s.capabilities;$('cameraInfo').textContent=c?`${c.name}\n${c.formats.join(', ')}\nISO ${c.minISO.toFixed(1)} - ${c.maxISO.toFixed(1)}\nShutter ${(c.minExposureSeconds*1000).toFixed(3)} - ${(c.maxExposureSeconds*1000).toFixed(1)} ms\n${c.maxPhotoWidth} x ${c.maxPhotoHeight}${c.proRAWMaxPhotoWidth?'\nProRAW: '+c.proRAWMaxPhotoWidth+' x '+c.proRAWMaxPhotoHeight:''}`:'No camera connected';active=s.jobs.find(j=>!['complete','failed','cancelled','expired'].includes(j.status));$('capture').disabled=!live||!!active;$('cancel').disabled=!active;$('jobs').replaceChildren();for(const j of [...s.jobs].reverse()){const tr=document.createElement('tr');for(const text of [j.request.context.label||j.request.id.slice(0,8),j.request.format+' / '+j.request.quality,j.status+(j.message?' : '+j.message:''),String(j.files)]){const td=document.createElement('td');td.textContent=text;tr.append(td)}$('jobs').append(tr)}$('previewAge').textContent=s.previewAgeSeconds===null?'':Math.round(s.previewAgeSeconds)+'s ago';if(s.previewAgeSeconds!==null){const blob=await(await api('/oc/v1/preview.jpg')).blob();const old=previewURL;previewURL=URL.createObjectURL(blob);$('preview').src=previewURL;$('preview').style.display='block';$('previewEmpty').hidden=true;if(old)URL.revokeObjectURL(old)}}catch(e){$('error').textContent=e.message;$('connection').textContent='Disconnected';$('capture').disabled=true}finally{if(timer!==null)timer=setTimeout(refresh,1500)}}
$('connect').onclick=()=>{token=$('token').value.trim();clearTimeout(timer);timer=0;$('error').textContent='';refresh()};
$('captureForm').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const mode=$('mode').value;const apply=e.submitter?.id==='apply';const job={protocolVersion:1,id:uuid(),format:mode==='raw'?'bayerRaw':mode==='proraw'?'appleProRaw':'jpeg',quality:['quality','proraw'].includes(mode)?'quality':'speed',frameCount:apply?1:Number($('frames').value),settleMilliseconds:Number($('settle').value),context:{label:$('label').value}};if(apply)job.operation='applyControls';if($('manual').checked){job.exposureSeconds=Number($('exposure').value)/1000;job.iso=Number($('iso').value)}if($('manualFocus').checked)job.focusPosition=Number($('focus').value);try{await post('/oc/v1/jobs',job);$('capture').disabled=true;$('apply').disabled=true}catch(e){$('error').textContent=e.message}};
$('cancel').onclick=async()=>{if(active)try{await post('/oc/v1/jobs/'+active.request.id+'/cancel')}catch(e){$('error').textContent=e.message}};
if($('token').value)$('connect').click();
</script></body></html>
