name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested build to GitHub Releases and the AltStore feed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test and build unsigned device IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-ios.sh
      - name: Simulator navigation and screenshots
        run: bash scripts/simulator-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenCapture-device
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Retain simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenCapture-test-diagnostics
          path: build/UITests.xcresult
          retention-days: 7
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: OpenCapture-device
          path: dist
      - name: Publish source-linked release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("dist/release.json"))["tag"])')
          gh release create "$TAG" dist/* --target "$SOURCE_COMMIT" --title "OpenCapture $TAG" --latest \
            --notes "Experimental unsigned device IPA for AltStore Classic. GPLv3 source is the source archive attached to this tag. Real camera and AltStore installation require device testing."
