name: Android
on:
  push:
    branches: [main, 'codex/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install stable Android SDK
        run: |
          SDK="$RUNNER_TEMP/opencapture-sdk"
          mkdir -p "$SDK"
          cp -R "$ANDROID_HOME/licenses" "$SDK/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build, lint and test both variants
        run: bash ./gradlew --no-daemon assembleDebug lint testDebugUnitTest testReleaseUnitTest
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenCapture-Android-reports
          path: android/app/build/reports/
          retention-days: 14
          if-no-files-found: error
      # Runner debug keys are temporary. Updates are packaged locally with the
      # established key; CI must never publish its differently signed APK.
